<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX OR NEW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      background: linear-gradient(135deg, #171717, #303030);
      display: flex;
      justify-content: center;
      text-align: center;
    }

    .start-screen {
      width: 100%;
      min-height: 100vh;
      padding: 40px 25px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .subtitle {
      font-size: 15px;
      letter-spacing: 4px;
      color: #ccc;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 56px;
      margin: 0;
      letter-spacing: 6px;
    }

    h2 {
      font-size: 36px;
      margin: 15px 0 25px;
    }

    h3 {
      font-size: 25px;
      margin-top: 0;
    }

    .description {
      margin: 20px 0 40px;
      color: #ddd;
      line-height: 1.8;
    }

    .start-button,
    .story-button {
      border: none;
      padding: 14px 35px;
      margin-top: 20px;
      border-radius: 30px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:hover,
    .story-button:hover {
      transform: scale(1.05);
    }

    .info-screen,
    .rules-screen,
    .characters-screen {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .info-text {
      color: #ddd;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    .rules-screen p {
      color: #ddd;
      line-height: 1.8;
      margin: 15px 0;
    }

    .character-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
      text-align: left;
    }

    .character-card p {
      margin: 9px 0;
      color: #ddd;
      line-height: 1.5;
    }

    .character-ending {
      margin-top: 25px;
      color: #ddd;
    }

    /* 스토리 */

    .story-screen {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .day-title {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 18px;
      letter-spacing: 3px;
      z-index: 10;
    }

    .story-background {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      background: linear-gradient(135deg, #191919, #303030);
    }

    .image-scene {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 70px 20px 20px;
      background: #111;
    }

    .scene-image {
      width: 100%;
      max-width: 700px;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .scene-text {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.88);
      border-radius: 15px;
      text-align: left;
    }

    .speaker {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .scene-text p {
      font-size: 17px;
      line-height: 1.7;
      margin: 7px 0;
    }

    .story-button {
      display: block;
      margin: 18px 0 0 auto;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      h2 {
        font-size: 30px;
      }

      .scene-image {
        max-height: 55vh;
      }

      .scene-text {
        padding: 16px;
      }

      .scene-text p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<main class="game">

  <section class="start-screen">

    <div>

      <div class="subtitle">
        ROMANCE SIMULATION GAME
      </div>

      <h1>
        EX OR NEW
      </h1>

      <p class="description">
        다시 시작된 첫사랑, 그리고 새로운 설렘.<br>
        당신의 선택은 누구를 향하게 될까?
      </p>

      <button class="start-button" onclick="startGame()">
        GAME START
      </button>

    </div>

  </section>

</main>


<script>

  /* =========================
     소리
     ========================= */

  let alarmSound = null;
  let phoneRing = null;


  /* =========================
     게임 시작
     ========================= */

  function startGame() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="info-screen">

        <div class="subtitle">
          PLAYER INFORMATION
        </div>

        <h2>
          플레이어 정보
        </h2>

        <p class="info-text">
          게임을 시작하기 전에<br>
          당신의 정보를 입력해주세요.
        </p>

        <input
          id="playerName"
          type="text"
          placeholder="이름"
        >

        <input
          id="playerAge"
          type="number"
          placeholder="나이"
        >

        <input
          id="playerBirth"
          type="date"
        >

        <button
          class="start-button"
          onclick="savePlayerInfo()"
        >
          확인
        </button>

      </div>
    `;
  }


  /* =========================
     정보 저장
     ========================= */

  function savePlayerInfo() {

    const name =
      document.getElementById("playerName").value;

    const age =
      document.getElementById("playerAge").value;

    const birth =
      document.getElementById("playerBirth").value;

    if (!name || !age || !birth) {

      alert("이름, 나이, 생년월일을 모두 입력해주세요!");

      return;
    }

    localStorage.setItem("playerName", name);
    localStorage.setItem("playerAge", age);
    localStorage.setItem("playerBirth", birth);


    document.querySelector(".start-screen").innerHTML = `

      <div class="rules-screen">

        <div class="subtitle">
          GAME RULES
        </div>

        <h2>
          게임 규칙
        </h2>

        <p>
          이 게임은 선택형 로맨스 시뮬레이션 게임입니다.
        </p>

        <p>
          플레이어의 선택에 따라<br>
          스토리와 결말이 달라집니다.
        </p>

        <p>
          이야기를 진행하며 다양한 선택지가 등장합니다.
        </p>

        <p>
          <strong>EX</strong>
          — 다시 시작된 첫사랑<br>

          <strong>NEW</strong>
          — 새롭게 시작되는 설렘
        </p>

        <p>
          어떤 선택을 할지는 당신에게 달려 있습니다.
        </p>

        <button
          class="start-button"
          onclick="showCharacters()"
        >
          NEXT
        </button>

      </div>
    `;
  }


  /* =========================
     등장인물
     ========================= */

  function showCharacters() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="characters-screen">

        <div class="subtitle">
          CHARACTER PROFILE
        </div>

        <h2>
          등장인물
        </h2>


        <div class="character-card">

          <h3>
            🐱 김준호
          </h3>

          <p>
            <strong>나이:</strong>
            18세
          </p>

          <p>
            <strong>생년월일:</strong>
            8월 17일
          </p>

          <p>
            <strong>관계:</strong>
            플레이어의 전남자친구
          </p>

          <p>
            <strong>성격:</strong>
            무심하고 차가워 보이지만,
            마음을 준 사람에게는 진심이다.
          </p>

          <p>
            <strong>인상:</strong>
            고양이상
          </p>

        </div>


        <div class="character-card">

          <h3>
            🐶 한호진
          </h3>

          <p>
            <strong>나이:</strong>
            18세
          </p>

          <p>
            <strong>관계:</strong>
            플레이어의 남사친
          </p>

          <p>
            <strong>성격:</strong>
            밝고 다정하며 장난기가 많다.
          </p>

          <p>
            <strong>인상:</strong>
            강아지상
          </p>

        </div>


        <p class="character-ending">
          이제 당신의 이야기가 시작됩니다.
        </p>


        <button
          class="start-button"
          onclick="startDay1()"
        >
          DAY 1 START
        </button>

      </div>
    `;
  }


  /* =========================
     DAY 1
     알람 화면
     ========================= */

  function startDay1() {

   alarmSound = 
     new Audio("alarm.mp3");

    alarmSound.loop = true;
    alarmSound.volume = 0.7;


    alarmSound.play().catch(function() {

      console.log(
        "알람 소리가 재생되지 않았습니다."
      );

    });


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="image-scene">

          <img
          src="IMG_0223.jpeg"
            class="scene-image"
            alt="휴대폰 알람 화면"
          >

          <div class="scene-text">

            <div class="speaker">
              📱 알람
            </div>

            <p>
              ⏰ 알람이 울리고 있다.
            </p>

            <button
              class="story-button"
              onclick="wakeUp()"
            >
              알람 끄기
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     알람 끄기
     ========================= */

  function wakeUp() {

    if (alarmSound) {

      alarmSound.pause();
      alarmSound.currentTime = 0;
      alarmSound = null;

    }


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              나
            </div>

            <p>
              으음…… 몇 시지?
            </p>

            <p>
              ……잠깐.
            </p>

            <p>
              <strong>헉! 늦었다!</strong>
            </p>

            <button
              class="story-button"
              onclick="nextScene2()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     다빈이 전화
     ========================= */

  function nextScene2() {

    phoneRing = new Audio("phone.mp3");
    
    phoneRing.loop = true;
    phoneRing.volume = 0.7;


    phoneRing.play().catch(function() {

      console.log(
        "전화벨이 재생되지 않았습니다."
      );

    });


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="image-scene">

          <img
            src="IMG_0224.jpeg"
            class="scene-image"
            alt="다빈이에게 전화가 오는 화면"
          >

          <div class="scene-text">

            <div class="speaker">
              📱 전화가 왔다
            </div>

            <p>
              띠링— 띠링—
            </p>

            <p>
              다빈이에게 전화가 와 있었다.
            </p>

            <button
              class="story-button"
              onclick="answerCall()"
            >
              📞 전화 받기
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     전화 받기
     ========================= */

  function answerCall() {

    if (phoneRing) {

      phoneRing.pause();
      phoneRing.currentTime = 0;
      phoneRing = null;

    }


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              📱 유다빈
            </div>

            <p>
              여보세요?!
            </p>

            <p>
              너 지금 어디야?!
            </p>

            <p>
              설마 아직 집이야?!
            </p>

            <button
              class="story-button"
              onclick="nextScene3()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     플레이어 대사
     ========================= */

  function nextScene3() {

    const playerName =
      localStorage.getItem("playerName");


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              ${playerName}
            </div>

            <p>
              나 지금 나가려고……!
            </p>

            <p>
              먼저 가 있어!
            </p>

            <button
              class="story-button"
              onclick="nextScene4()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     다빈 대사
     ========================= */

  function nextScene4() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              유다빈
            </div>

            <p>
              알았어! 빨리 와!
            </p>

            <p>
              나도 지금 학교 가는 중이야!
            </p>

            <button
              class="story-button"
              onclick="nextScene5()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     학교로 출발
     ========================= */

  function nextScene5() {

    const playerName =
      localStorage.getItem("playerName");


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              ${playerName}
            </div>

            <p>
              전화를 끊고 급하게 집을 나섰다.
            </p>

            <p>
              오늘은 정말 지각이다……
            </p>

            <button
              class="story-button"
              onclick="nextScene6()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     준호 등장
     ========================= */

  function nextScene6() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">
          DAY 1
        </div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">
              나
            </div>

            <p>
              ……어?
            </p>

            <p>
              저 사람……
            </p>

            <p>
              설마…… 준호?
            </p>

            <button
              class="story-button"
              onclick="nextScene7()"
            >
              NEXT
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /* =========================
     임시 다음 장면
     ========================= */

  function nextScene7() {

    alert(
      "다음 장면은 준호가 자전거를 타고 지나가는 장면입니다!"
    );

  }

</script>

</body>
</html>
