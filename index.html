<script>

  // =========================
  // 게임 시작
  // =========================

  function startGame() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="info-screen">

        <div class="subtitle">PLAYER INFORMATION</div>

        <h2>플레이어 정보</h2>

        <p class="info-text">
          게임을 시작하기 전에<br>
          당신의 정보를 입력해주세요.
        </p>

        <input id="playerName" type="text" placeholder="이름">

        <input id="playerAge" type="number" placeholder="나이">

        <input id="playerBirth" type="date">

        <button class="start-button" onclick="savePlayerInfo()">
          확인
        </button>

      </div>

    `;
  }


  // =========================
  // 플레이어 정보 저장
  // =========================

  function savePlayerInfo() {

    const name = document.getElementById("playerName").value;
    const age = document.getElementById("playerAge").value;
    const birth = document.getElementById("playerBirth").value;

    if (!name || !age || !birth) {
      alert("이름, 나이, 생년월일을 모두 입력해주세요!");
      return;
    }

    localStorage.setItem("playerName", name);
    localStorage.setItem("playerAge", age);
    localStorage.setItem("playerBirth", birth);

    document.querySelector(".start-screen").innerHTML = `

      <div class="rules-screen">

        <div class="subtitle">GAME RULES</div>

        <h2>게임 규칙</h2>

        <p>
          이 게임은 선택형 로맨스 시뮬레이션 게임입니다.
        </p>

        <p>
          플레이어의 선택에 따라<br>
          스토리와 결말이 달라집니다.
        </p>

        <p>
          이야기를 진행하며 다양한 선택지가 등장합니다.
        </p>

        <p>
          <strong>EX</strong> — 다시 시작된 첫사랑<br>
          <strong>NEW</strong> — 새롭게 시작되는 설렘
        </p>

        <p>
          어떤 선택을 할지는 당신에게 달려 있습니다.
        </p>

        <button class="start-button" onclick="showCharacters()">
          NEXT
        </button>

      </div>

    `;
  }


  // =========================
  // 캐릭터 정보
  // =========================

  function showCharacters() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="characters-screen">

        <div class="subtitle">CHARACTER PROFILE</div>

        <h2>등장인물</h2>

        <div class="character-card">

          <h3>🐱 김준호</h3>

          <p><strong>나이:</strong> 18세</p>

          <p><strong>생년월일:</strong> 8월 17일</p>

          <p><strong>관계:</strong> 플레이어의 전남자친구</p>

          <p>
            <strong>성격:</strong>
            무심하고 차가워 보이지만,
            마음을 준 사람에게는 진심이다.
          </p>

          <p><strong>인상:</strong> 고양이상</p>

        </div>


        <div class="character-card">

          <h3>🐶 한호진</h3>

          <p><strong>나이:</strong> 18세</p>

          <p><strong>관계:</strong> 플레이어의 남사친</p>

          <p>
            <strong>성격:</strong>
            밝고 다정하며 장난기가 많다.
          </p>

          <p><strong>인상:</strong> 강아지상</p>

        </div>


        <p class="character-ending">
          이제 당신의 이야기가 시작됩니다.
        </p>

        <button class="start-button" onclick="startDay1()">
          DAY 1 START
        </button>

      </div>

    `;
  }


  // =========================
  // DAY 1
  // =========================

  function startDay1() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">나</div>

            <p>
              오늘도 평범한 하루가 시작될 줄 알았다.
            </p>

            <p>
              하지만 그날은 조금 달랐다.
            </p>

            <button class="story-button" onclick="nextScene1()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 아침
  // =========================

  function nextScene1() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">나</div>

            <p>으음…… 몇 시지?</p>

            <p>……잠깐.</p>

            <p><strong>헉! 늦었다!</strong></p>

            <button class="story-button" onclick="nextScene2()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 전화가 오는 장면
  // =========================

  let phoneRing = null;


  function nextScene2() {

    phoneRing = new Audio("images/phone-ring.mp3");

    phoneRing.loop = true;
    phoneRing.volume = 0.7;

    phoneRing.play().catch(function() {
      console.log("브라우저에서 소리 재생이 차단되었습니다.");
    });


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">📱 전화가 왔다</div>

            <p>
              띠링— 띠링—
            </p>

            <p>
              화면을 확인하니 유다빈에게 전화가 와 있었다.
            </p>

            <button class="story-button" onclick="answerCall()">
              📞 전화 받기
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 전화 받기
  // =========================

  function answerCall() {

    if (phoneRing) {
      phoneRing.pause();
      phoneRing.currentTime = 0;
      phoneRing = null;
    }


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">📱 유다빈</div>

            <p>여보세요?!</p>

            <p>너 지금 어디야?!</p>

            <p>설마 아직 집이야?!</p>

            <button class="story-button" onclick="nextScene3()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 유다빈과 통화
  // =========================

  function nextScene3() {

    const playerName =
      localStorage.getItem("playerName");


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">${playerName}</div>

            <p>
              나 지금 나가려고……!
            </p>

            <p>
              먼저 가 있어!
            </p>

            <button class="story-button" onclick="nextScene4()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  function nextScene4() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">유다빈</div>

            <p>
              알았어! 빨리 와!
            </p>

            <p>
              나도 지금 학교 가는 중이야!
            </p>

            <button class="story-button" onclick="nextScene5()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 학교로 출발
  // =========================

  function nextScene5() {

    const playerName =
      localStorage.getItem("playerName");


    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">${playerName}</div>

            <p>
              전화를 끊고 급하게 집을 나섰다.
            </p>

            <p>
              오늘은 정말 지각이다……
            </p>

            <button class="story-button" onclick="nextScene6()">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }


  // =========================
  // 준호 등장 전
  // =========================

  function nextScene6() {

    document.querySelector(".start-screen").innerHTML = `

      <div class="story-screen">

        <div class="day-title">DAY 1</div>

        <div class="story-background">

          <div class="scene-text">

            <div class="speaker">나</div>

            <p>……어?</p>

            <p>저 사람……</p>

            <p>설마…… 준호?</p>

            <button class="story-button" onclick="alert('다음 장면: 자전거를 타고 지나가는 준호')">
              NEXT
            </button>

          </div>

        </div>

      </div>

    `;
  }

</script>
