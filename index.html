<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX OR NEW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #171717, #303030);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .start-screen {
      width: 100%;
      padding: 40px 25px;
    }

    .subtitle {
      font-size: 15px;
      letter-spacing: 4px;
      color: #ccc;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 56px;
      margin: 0;
      letter-spacing: 6px;
    }

    h2 {
      font-size: 36px;
      margin: 15px 0 25px;
    }

    h3 {
      font-size: 25px;
      margin-top: 0;
    }

    .description {
      margin: 20px 0 40px;
      color: #ddd;
      line-height: 1.8;
    }

    .start-button {
      border: none;
      padding: 15px 55px;
      margin-top: 20px;
      border-radius: 30px;
      background: white;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:hover {
      transform: scale(1.05);
    }

    .info-screen,
    .rules-screen,
    .characters-screen {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .info-text {
      color: #ddd;
      margin-bottom: 25px;
    }

    .rules-screen p {
      color: #ddd;
      line-height: 1.8;
      margin: 15px 0;
    }

    .character-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
      text-align: left;
    }

    .character-card p {
      margin: 9px 0;
      color: #ddd;
      line-height: 1.5;
    }

    .character-card strong {
      color: white;
    }

    .character-ending {
      margin-top: 25px;
      color: #ddd;
    }
  </style>
</head>

<body>

  <main class="game">

    <section class="start-screen">

      <div class="subtitle">ROMANCE SIMULATION GAME</div>

      <h1>EX OR NEW</h1>

      <p class="description">
        다시 시작된 첫사랑, 그리고 새로운 설렘.<br>
        당신의 선택은 누구를 향하게 될까?
      </p>

      <button class="start-button" onclick="startGame()">
        GAME START
      </button>

    </section>

  </main>


  <script>

    // 게임 시작
    function startGame() {

      document.querySelector(".start-screen").innerHTML = `

        <div class="info-screen">

          <div class="subtitle">PLAYER INFORMATION</div>

          <h2>플레이어 정보</h2>

          <p class="info-text">
            게임을 시작하기 전에<br>
            당신의 정보를 입력해주세요.
          </p>

          <input
            id="playerName"
            type="text"
            placeholder="이름"
          >

          <input
            id="playerAge"
            type="number"
            placeholder="나이"
          >

          <input
            id="playerBirth"
            type="date"
          >

          <button class="start-button" onclick="savePlayerInfo()">
            확인
          </button>

        </div>

      `;
    }


    // 플레이어 정보 저장
    function savePlayerInfo() {

      const name = document.getElementById("playerName").value;
      const age = document.getElementById("playerAge").value;
      const birth = document.getElementById("playerBirth").value;


      if (!name || !age || !birth) {

        alert("이름, 나이, 생년월일을 모두 입력해주세요!");

        return;
      }


      // 플레이어 이름 기억하기
      localStorage.setItem("playerName", name);
      localStorage.setItem("playerAge", age);
      localStorage.setItem("playerBirth", birth);


      // 게임 규칙 화면
      document.querySelector(".start-screen").innerHTML = `

        <div class="rules-screen">

          <div class="subtitle">GAME RULES</div>

          <h2>게임 규칙</h2>

          <p>
            이 게임은 선택형 로맨스 시뮬레이션 게임입니다.
          </p>

          <p>
            플레이어의 선택에 따라<br>
            스토리와 결말이 달라집니다.
          </p>

          <p>
            이야기를 진행하며 다양한 선택지가 등장합니다.
          </p>

          <p>
            <strong>EX</strong> — 다시 시작된 첫사랑<br>
            <strong>NEW</strong> — 새롭게 시작되는 설렘
          </p>

          <p>
            어떤 선택을 할지는 당신에게 달려 있습니다.
          </p>

          <button class="start-button" onclick="showCharacters()">
            NEXT
          </button>

        </div>

      `;
    }


    // 캐릭터 정보
    function showCharacters() {

      document.querySelector(".start-screen").innerHTML = `

        <div class="characters-screen">

          <div class="subtitle">CHARACTER PROFILE</div>

          <h2>등장인물</h2>


          <div class="character-card">

            <h3>🐱 김준호</h3>

            <p>
              <strong>나이:</strong> 18세
            </p>

            <p>
              <strong>생년월일:</strong> 8월 17일
            </p>

            <p>
              <strong>관계:</strong> 플레이어의 전남자친구
            </p>

            <p>
              <strong>성격:</strong>
              무심하고 차가워 보이지만,
              마음을 준 사람에게는 진심이다.
            </p>

            <p>
              <strong>인상:</strong> 고양이상
            </p>

          </div>


          <div class="character-card">

            <h3>🐶 한호진</h3>

            <p>
              <strong>나이:</strong> 18세
            </p>

            <p>
              <strong>관계:</strong> 플레이어의 남사친
            </p>

            <p>
              <strong>성격:</strong>
              밝고 다정하며 장난기가 많다.
            </p>

            <p>
              <strong>인상:</strong> 강아지상
            </p>

          </div>


          <p class="character-ending">
            이제 당신의 이야기가 시작됩니다.
          </p>


          <button class="start-button" onclick="startDay1()">
            DAY 1 START
          </button>

        </div>

      `;
    }


    // DAY 1 시작
    function startDay1() {

      const playerName = localStorage.getItem("playerName");

      document.querySelector(".start-screen").innerHTML = `

        <div class="rules-screen">

          <div class="subtitle">DAY 1</div>

          <h2>새로운 하루</h2>

          <p>
            ${playerName}의 이야기가 시작된다.
          </p>

          <button class="start-button" onclick="alert('DAY 1 스토리를 시작합니다!')">
            NEXT
          </button>

        </div>

      `;
    }
    function startDay1() {

  const playerName = localStorage.getItem("playerName");

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">나</div>

          <p>오늘도 평범한 하루가 시작될 줄 알았다.</p>

          <p>하지만 그날은 조금 달랐다.</p>

          <button class="story-button" onclick="nextScene1()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene1() {

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">나</div>

          <p>으음…… 몇 시지?</p>

          <p>……잠깐.</p>

          <p><strong>헉! 늦었다!</strong></p>

          <button class="story-button" onclick="nextScene2()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene2() {

  // 전화 벨소리
  const phoneRing = new Audio("images/phone-ring.mp3");

  phoneRing.loop = true;
  phoneRing.volume = 0.7;

  phoneRing.play().catch(() => {
    console.log("벨소리는 화면을 한 번 터치한 후 재생될 수 있습니다.");
  });

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">📱 전화가 왔다</div>

          <p>띠링— 띠링—</p>

          <p>화면을 확인하니 유다빈에게 전화가 와 있었다.</p>

          <button class="story-button" onclick="answerCall()">
            📞 전화 받기
          </button>

        </div>

      </div>

    </div>
  `;
}


function answerCall() {

  // 벨소리 멈추기
  document.querySelectorAll("audio").forEach(audio => {
    audio.pause();
    audio.currentTime = 0;
  });

  const playerName = localStorage.getItem("playerName");

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">📱 유다빈</div>

          <p>여보세요?!</p>

          <p>너 지금 어디야?!</p>

          <p>설마 아직 집이야?!</p>

          <button class="story-button" onclick="nextScene3()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene3() {

  const playerName = localStorage.getItem("playerName");

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">${playerName}</div>

          <p>나 지금 나가려고……!</p>

          <p>먼저 가 있어!</p>

          <button class="story-button" onclick="nextScene4()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene4() {

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">유다빈</div>

          <p>알았어! 빨리 와!</p>

          <p>나도 지금 학교 가는 중이야!</p>

          <button class="story-button" onclick="nextScene5()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene5() {

  const playerName = localStorage.getItem("playerName");

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">${playerName}</div>

          <p>전화를 끊고 급하게 집을 나섰다.</p>

          <p>오늘은 정말 지각이다……</p>

          <button class="story-button" onclick="nextScene6()">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}


function nextScene6() {

  document.querySelector(".start-screen").innerHTML = `

    <div class="story-screen">

      <div class="day-title">DAY 1</div>

      <div class="story-background">

        <div class="scene-text">

          <div class="speaker">나</div>

          <p>……어?</p>

          <p>저 사람……</p>

          <p>설마…… 준호?</p>

          <button class="story-button" onclick="alert('다음 장면: 자전거를 타고 지나가는 준호')">
            NEXT
          </button>

        </div>

      </div>

    </div>
  `;
}

  </script>

</body>
</html>
